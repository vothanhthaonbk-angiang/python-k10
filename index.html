    <!-- Essential Inline Polyfills for Older Phones (iOS 11-14 Safari & Older Android WebView) -->
    <script>
      (function() {
        // globalThis polyfill
        if (typeof globalThis === 'undefined') {
          if (typeof window !== 'undefined') window.globalThis = window;
          else if (typeof self !== 'undefined') self.globalThis = self;
          else if (typeof global !== 'undefined') global.globalThis = global;
        }

        // Object.fromEntries polyfill
        if (!Object.fromEntries) {
          Object.fromEntries = function(entries) {
            if (!entries || !entries[Symbol.iterator]) { throw new TypeError('Object.fromEntries requires an iterable'); }
            var obj = {};
            for (var pair of entries) {
              if (Object(pair) !== pair) { throw new TypeError('iterable for fromEntries should yield objects'); }
              obj[pair[0]] = pair[1];
            }
            return obj;
          };
        }

        // Array.prototype.flat polyfill
        if (!Array.prototype.flat) {
          Array.prototype.flat = function(depth) {
            var flt = function(arr, d) {
              return d > 0 ? arr.reduce(function(acc, val) {
                return acc.concat(Array.isArray(val) ? flt(val, d - 1) : val);
              }, []) : arr.slice();
            };
            return flt(this, depth === undefined ? 1 : Number(depth));
          };
        }

        // Array.prototype.flatMap polyfill
        if (!Array.prototype.flatMap) {
          Array.prototype.flatMap = function(cb, thisArg) {
            return this.map(cb, thisArg).flat();
          };
        }

        // Promise.allSettled polyfill
        if (!Promise.allSettled) {
          Promise.allSettled = function(promises) {
            return Promise.all(
              Array.from(promises).map(function(p) {
                return Promise.resolve(p).then(
                  function(value) { return { status: 'fulfilled', value: value }; },
                  function(reason) { return { status: 'rejected', reason: reason }; }
                );
              })
            );
          };
        }
      })();
    </script>
