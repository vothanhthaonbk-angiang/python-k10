<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2e5c"/>
      <stop offset="50%" stop-color="#0d3d78"/>
      <stop offset="100%" stop-color="#051937"/>
    </linearGradient>
    <linearGradient id="blueSnake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldSnake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background with subtle squircle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Subtle glow -->
  <circle cx="256" cy="240" r="190" fill="#38bdf8" opacity="0.08"/>

  <!-- Python Dual Snake Emblem centered in safe zone -->
  <g transform="translate(68, 60) scale(0.74)" filter="url(#shadow)">
    <!-- Blue Upper Snake -->
    <path fill="url(#blueSnake)" d="M 245 40 C 135 40 142 88 142 88 L 142 138 L 249 138 L 249 153 L 98 153 C 98 153 40 146 40 256 C 40 366 90 358 90 358 L 132 358 L 132 300 C 132 300 129 231 202 231 L 308 231 C 308 231 371 234 371 172 L 371 106 C 371 106 376 40 245 40 Z M 198 75 C 213 75 225 87 225 102 C 225 117 213 129 198 129 C 183 129 171 117 171 102 C 171 87 183 75 198 75 Z"/>
    <!-- Yellow Lower Snake -->
    <path fill="url(#goldSnake)" d="M 267 472 C 377 472 370 424 370 424 L 370 374 L 263 374 L 263 359 L 414 359 C 414 359 472 366 472 256 C 472 146 422 154 422 154 L 380 154 L 380 212 C 380 212 383 281 310 281 L 204 281 C 204 281 141 278 141 340 L 141 406 C 141 406 136 472 267 472 Z M 314 437 C 299 437 287 425 287 410 C 287 395 299 383 314 383 C 329 383 341 395 341 410 C 341 425 329 437 314 437 Z"/>
  </g>

  <!-- Grade 10 & School badge at bottom -->
  <g transform="translate(256, 436)">
    <rect x="-85" y="-24" width="170" height="42" rx="21" fill="#071e3d" stroke="#f59e0b" stroke-width="2.5" opacity="0.95"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#fbbf24" text-anchor="middle" letter-spacing="1.5">PYTHON 10</text>
  </g>
</svg>
