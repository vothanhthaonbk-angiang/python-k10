<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2e5c"/>
      <stop offset="50%" stop-color="#0d3d78"/>
      <stop offset="100%" stop-color="#051937"/>
    </linearGradient>
    <linearGradient id="blueSnakeM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldSnakeM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable (no corner radius because Android crops it) -->
  <rect width="512" height="512" fill="url(#maskGrad)"/>

  <!-- Centered inside the 80% safe zone diameter (diameter ~380px) -->
  <g transform="translate(104, 76) scale(0.59)">
    <!-- Blue Upper Snake -->
    <path fill="url(#blueSnakeM)" d="M 245 40 C 135 40 142 88 142 88 L 142 138 L 249 138 L 249 153 L 98 153 C 98 153 40 146 40 256 C 40 366 90 358 90 358 L 132 358 L 132 300 C 132 300 129 231 202 231 L 308 231 C 308 231 371 234 371 172 L 371 106 C 371 106 376 40 245 40 Z M 198 75 C 213 75 225 87 225 102 C 225 117 213 129 198 129 C 183 129 171 117 171 102 C 171 87 183 75 198 75 Z"/>
    <!-- Yellow Lower Snake -->
    <path fill="url(#goldSnakeM)" d="M 267 472 C 377 472 370 424 370 424 L 370 374 L 263 374 L 263 359 L 414 359 C 414 359 472 366 472 256 C 472 146 422 154 422 154 L 380 154 L 380 212 C 380 212 383 281 310 281 L 204 281 C 204 281 141 278 141 340 L 141 406 C 141 406 136 472 267 472 Z M 314 437 C 299 437 287 425 287 410 C 287 395 299 383 314 383 C 329 383 341 395 341 410 C 341 425 329 437 314 437 Z"/>
  </g>

  <!-- Python 10 text safely positioned in safe zone -->
  <g transform="translate(256, 395)">
    <rect x="-75" y="-18" width="150" height="36" rx="18" fill="#071e3d" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#fbbf24" text-anchor="middle" letter-spacing="1">PYTHON 10</text>
  </g>
</svg>
